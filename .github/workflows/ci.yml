name: CI

# Fast path: lint + cached bootstrap + test suite. Runs on every PR and every
# push to main. Ubuntu only — macOS lives in cold-start.yml because it's slow
# and PRs rarely need it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Cancel superseded PR runs to stop burning minutes on stale pushes. Don't
# cancel main runs — a half-finished run can leave caches in a weird state.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
      - name: Run linting checks
        run: hk check

  test-cached:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # test/claude-shell-dispatch.bats runs the no-bare-`claude` account guard
      # through all three shells it ships for. The ubuntu-24.04 image stopped
      # shipping zsh and never shipped fish, so without this the guard is only
      # ever exercised under bash on the fast path. The tests degrade to the
      # shells present rather than failing, which is exactly why a missing shell
      # would otherwise go unnoticed here.
      - name: Install dispatch shells
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh fish
      - name: Bootstrap (cached)
        uses: ./.github/actions/bootstrap-dotfiles
        with:
          use-cache: 'true'
          github-token: ${{ secrets.MISE_GITHUB_TOKEN }}
      - name: Run test suite
        run: ./bin/test
