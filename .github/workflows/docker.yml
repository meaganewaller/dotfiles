name: Docker

# Builds the dev-environment Dockerfile and smoke-tests it by running the
# bats suite inside the resulting image. Complements cold-start.yml (bare
# metal) by exercising the same ./install path inside a container — and,
# unlike the other CI jobs, this is the first automated coverage of
# ./install's own Linux apt-based mise/chezmoi bootstrap (the other jobs
# pre-install mise via jdx/mise-action before calling ./install).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.devcontainer/**'
      - 'install'
      - 'home/**/run_*'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        env:
          GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
        run: docker build --secret id=github_token,env=GITHUB_TOKEN -t dotfiles-dev .

      - name: Run test suite in container
        env:
          GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
        run: docker run --rm -e GITHUB_TOKEN="$GITHUB_TOKEN" dotfiles-dev zsh -lc "bin/setup && bin/test"
