# Development tools for shell scripting and testing

# Lockfile format 2 pins npm-backend tools to a digest-checked "dependency
# sidecar" only when npm.package_manager is "auto". That digest resolves
# differently machine to machine, so Renovate's lockFileMaintenance run
# rewrote it on every pass without regenerating the sidecar files, and CI
# failed on a digest mismatch. Pinning the package manager explicitly skips
# the sidecar entirely. npm over pnpm because npm already ships with node.
[settings]
npm.package_manager = "npm"

[tools]
"aqua:bats-core/bats-core" = "v1.13.0"
"aqua:gitleaks/gitleaks" = "v8.30.1"
"aqua:koalaman/shellcheck" = "v0.11.0"
"aqua:mikefarah/yq" = "v4.53.6"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
hk = "2.2.0"
jq = "1.8.2"
# Install dependency of the npm: tools below. bin/setup installs only this
# file's tools, so without node here a global node pin that isn't installed yet
# (a fresh container) makes mise refuse to install them.
node = "24.21.0"
"npm:markdownlint-cli" = "0.49.1"
pkl = "0.32.1"
shfmt = "3.14.1"
stylua = "2.5.2"

[tasks.lint]
description = "Lint and auto-fix"
run = "hk fix"

[tasks.test]
description = "Run test suite"
run = "bats test/"

[tasks."ci:lint"]
description = "Run lint as CI does (hk check, not hk fix)"
run = "hk check"
env = { CI = "true", GITHUB_ACTIONS = "true" }

[tasks."ci:test"]
description = "Run tests as CI does (with CI and GITHUB_ACTIONS set)"
run = "bats test/"
env = { CI = "true", GITHUB_ACTIONS = "true" }

[tasks."ci:all"]
description = "Run the full CI shape locally (lint + test, no install)"
depends = ["ci:lint", "ci:test"]
