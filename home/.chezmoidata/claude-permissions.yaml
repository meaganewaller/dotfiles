# Global Claude Code tool permissions, merged into every account's settings.json
# by home/.chezmoitemplates/claude-settings (rendered from each account's
# modify_private_settings.json.tmpl).
#
# Split out from claude.yaml purely for diff hygiene: this list is long and
# churns on its own cadence. Chezmoi deep-merges every file in .chezmoidata/,
# so these keys land under the same claudeData.shared as claude.yaml's.
#
# `$HOME` is expanded to the real home directory by the rendering template --
# data files are not templates, so `{{ .chezmoi.homeDir }}` cannot be used here.
#
# Account-specific additions go in claude.yaml under claudeData.<account>.
# permissions.allow; they are concatenated onto this list, not replacing it.

claudeData:
  shared:
    permissions:
      defaultMode: "auto"
      allow:
