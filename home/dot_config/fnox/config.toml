# Machine-wide fnox manifest -> ~/.config/fnox/config.toml
#
# Holds 1Password *references*, never values: this repository is public. A
# reference names a vault and an item, which is a pointer, not a credential.
#
# One consumer, on demand. Nothing here is resolved at shell startup: a command
# gets its key inside its own process, via
# `fnox exec --config "$HOME/.config/fnox/config.toml" -- <tool>`. That is how
# `bd linear sync --pull` gets LINEAR_API_KEY -- see dot_config/shell/bd.sh.
#
# There used to be a second route. `mise run secrets` exported this manifest to
# ~/.secrets for "agents and dotenv-only tools". It was retired once measurement
# showed the file had exactly one writer and no readers: neither consumer was
# ever wired, because nothing sources a dotenv file, and wiring it the only
# general way -- sourcing at shell startup -- is what makes a key
# environment-resident.
#
# Interactive shells deliberately get nothing. mise's `_.fnox-env` plugin used
# to inject [secrets] natively, which reads as free until you notice mise
# re-resolves its env on every activation and every shim invocation: each new
# terminal cost two 1Password unlocks and each shim call could cost another, to
# hand every shell a key one command wants. See the [env] comment in
# dot_config/mise/config.toml.tmpl.
#
# A bare `1password` provider is sufficient because every value below is a
# fully-qualified op:// URI; no vault or account key is needed. Authentication
# rides on the 1Password desktop app's session (`op account list` to check).
#
# Keys shared by every machine go in [secrets]. fnox merges [secrets] into
# whichever profile is selected, so a work-only key would go in a
# [profiles.work.secrets] block -- there is no such key yet.

[providers]
onepassword = { type = "1password" }

[secrets]
LINEAR_API_KEY = { provider = "onepassword", value = "op://Automation/Linear Onlooker API Key/credential" }

# Credentials fetched per invocation, NOT exported into shells.
#
# These live in their own profiles so that each command receives only its own
# credential, via `fnox exec --profile <name> -- <tool>`. The secret exists only
# inside the one process that asked for it.
#
# That is a real property, not tidiness. An environment-resident key is readable
# by anything running as you and trivially copied by accident -- dotfiles-vv3
# recorded one leaking twice in a single session through accidental env dumps,
# while these alias-resident keys leaked zero times.
#
# One profile per tool, rather than one shared profile, so each command receives
# only its own credential. fnox merges top-level [secrets] into whichever profile
# is selected, so LINEAR_API_KEY does ride along into these processes. That is a
# small over-grant, accepted: they are this user's own tools, run deliberately,
# and the alternative -- no shared block, one profile per key -- buys nothing
# while making every future key a two-place edit.
#
# Keep these profile names distinct from any profile a future export task might
# select. test/credential-aliases.bats and the plaintext guard in
# test/shell-startup-secrets.bats both fail if that stops being true.

[profiles.claude.secrets]
ANTHROPIC_API_KEY = { provider = "onepassword", value = "op://Private/Claude Dotfiles API Key/key" }

[profiles.buildkite.secrets]
BUILDKITE_API_TOKEN = { provider = "onepassword", value = "op://Development/Buildkite API/key" }
